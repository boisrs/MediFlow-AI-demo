<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="billing">
  <div class="layout">
    <aside class="sidebar">
      <h2>MediFlow</h2>
      <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
      <a href="patients.html" data-i18n="nav.patients">Patient Registry</a>
      <a href="opd.html" data-i18n="nav.opd">OPD</a>
      <a href="ipd.html" data-i18n="nav.ipd">IPD</a>
      <a href="pharmacy.html" data-i18n="nav.pharmacy">Pharmacy</a>
      <a href="lab.html" data-i18n="nav.lab">Lab</a>
      <a href="xray.html" data-i18n="nav.xray">X-ray</a>
      <a href="billing.html" data-i18n="nav.billing">Billing</a>
      <a href="index.html" data-i18n="nav.logout">Logout</a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 data-i18n="billing.title">Billing</h1>
          <p data-i18n="billing.subtitle">ข้อมูลค่าใช้จ่ายและการเรียกเก็บ</p>
        </div>
        <div class="topbar-right">
          <label class="sr-only" for="langSelect">Language</label>
          <select id="langSelect" aria-label="Language switcher">
            <option value="lo">ລາວ</option>
            <option value="th">ภาษาไทย</option>
            <option value="en">English</option>
          </select>
        </div>
      </header>

      <section class="panel">
        <h2 data-i18n="common.select_patient">เลือกผู้ป่วย</h2>
        <div id="patientList" class="patient-list"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="billing.create">สร้างบิล</h2>
        <form id="billingForm">
          <input id="billingAmount" type="number" placeholder="จำนวนเงิน" data-i18n-placeholder="billing.form.amount">
          <select id="billingType" data-i18n="billing.form.type">
            <option value="Consultation" data-i18n="billing.type.consultation">Consultation</option>
            <option value="Admission" data-i18n="billing.type.admission">Admission</option>
            <option value="Lab" data-i18n="billing.type.lab">Lab</option>
            <option value="Imaging" data-i18n="billing.type.imaging">Imaging</option>
          </select>
          <button type="submit" data-i18n="billing.submit">สร้างบิล</button>
          <p class="message"></p>
        </form>
      </section>

      <section class="panel" id="aiPanel"></section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
