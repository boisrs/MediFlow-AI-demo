<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab</title>
  <link rel="stylesheet" href="css/style.css?v=20260801">
</head>
<body data-page="lab">
  <div class="layout">
    <aside class="sidebar">
      <h2>MediFlow</h2>
      <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
      <a href="patients.html" data-i18n="nav.patients">Patient Registry</a>
      <a href="opd.html" data-i18n="nav.opd">OPD</a>
      <a href="ipd.html" data-i18n="nav.ipd">IPD</a>
      <a href="pharmacy.html" data-i18n="nav.pharmacy">Pharmacy</a>
      <a href="lab.html" data-i18n="nav.lab">Lab</a>
      <a href="xray.html" data-i18n="nav.xray">X-ray</a>
      <a href="billing.html" data-i18n="nav.billing">Billing</a>
      <a href="index.html" data-i18n="nav.logout">Logout</a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 data-i18n="lab.title">Lab</h1>
          <p data-i18n="lab.subtitle">คำสั่งตรวจทางห้องปฏิบัติการ</p>
        </div>
        <div class="topbar-right">
          <label class="sr-only" for="langSelect">Language</label>
          <select id="langSelect" aria-label="Language switcher">
            <option value="lo">ລາວ</option>
            <option value="th">ภาษาไทย</option>
            <option value="en">English</option>
          </select>
        </div>
      </header>

      <section class="panel">
        <h2 data-i18n="common.select_patient">เลือกผู้ป่วย</h2>
        <div id="patientList" class="patient-list"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="lab.order">ส่งคำสั่ง Lab</h2>
        <form id="labForm">
          <input id="labTest" placeholder="ประเภทการตรวจ" data-i18n-placeholder="lab.form.test">
          <button type="submit" data-i18n="lab.submit">ส่งคำสั่ง</button>
          <p class="message"></p>
        </form>
      </section>

      <section class="panel">
        <h2 data-i18n="lab.result.title">ใส่ผล Lab</h2>
        <form id="labResultForm">
          <input id="labResultValue" placeholder="ผลตรวจ" data-i18n-placeholder="lab.result.value">
          <select id="labResultStatus">
            <option value="Completed" data-i18n="status.completed">Completed</option>
            <option value="Pending" data-i18n="status.pending">Pending</option>
          </select>
          <button type="submit" data-i18n="lab.result.save">บันทึกผล</button>
          <p class="message"></p>
        </form>
      </section>

      <section class="panel">
        <h2 data-i18n="lab.result.list">ผล Lab ล่าสุด</h2>
        <div id="labResultsList"></div>
      </section>

      <section class="panel" id="aiPanel"></section>
    </main>
  </div>

  <script src="js/app.js?v=20260801"></script>
</body>
</html>
